<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <style>
    .bond { stroke: black; stroke-width: 2; fill: none; }
    .thick { stroke: black; stroke-width: 3; fill: none; }
    .text { font-family: serif; font-size: 14px; }
  </style>

  <!-- Glucose Haworth -->
  <g transform="translate(20, 40)">
    <!-- Hexagonal ring (perspective) -->
    <polygon points="30,50 70,30 120,40 130,80 90,100 40,90" class="bond"/>
    <!-- Ring oxygen label -->
    <text x="25" y="55" class="text">O</text>
    <!-- C1 (anomeric carbon, right) -->
    <line x1="120" y1="40" x2="135" y2="25" class="thick"/>
    <text x="140" y="20" class="text">OH</text>
    <!-- C2 (lower right) -->
    <line x1="130" y1="80" x2="145" y2="95" class="thick"/>
    <text x="150" y="100" class="text">OH</text>
    <!-- C3 (lower left) -->
    <line x1="90" y1="100" x2="80" y2="115" class="thick"/>
    <text x="60" y="125" class="text">OH</text>
    <!-- C4 (left) -->
    <line x1="40" y1="90" x2="25" y2="105" class="thick"/>
    <text x="5" y="115" class="text">OH</text>
    <!-- C5 (upper left) -->
    <line x1="30" y1="50" x2="15" y2="35" class="thick"/>
    <text x="0" y="30" class="text">CH₂OH</text>
  </g>

  <!-- Mannose Haworth -->
  <g transform="translate(220, 40)">
    <!-- Hexagonal ring -->
    <polygon points="30,50 70,30 120,40 130,80 90,100 40,90" class="bond"/>
    <text x="25" y="55" class="text">O</text>
    <!-- C1 -->
    <line x1="120" y1="40" x2="135" y2="25" class="thick"/>
    <text x="140" y="20" class="text">OH</text>
    <!-- C2 (in mannose, OH points up) -->
    <line x1="130" y1="80" x2="140" y2="65" class="thick"/>
    <text x="145" y="60" class="text">OH</text>
    <!-- C3 -->
    <line x1="90" y1="100" x2="80" y2="115" class="thick"/>
    <text x="60" y="125" class="text">OH</text>
    <!-- C4 -->
    <line x1="40" y1="90" x2="25" y2="105" class="thick"/>
    <text x="5" y="115" class="text">OH</text>
    <!-- C5 -->
    <line x1="30" y1="50" x2="15" y2="35" class="thick"/>
    <text x="0" y="30" class="text">CH₂OH</text>
  </g>
</svg>